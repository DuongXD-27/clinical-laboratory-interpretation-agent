target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[lint.per-file-ignores]
# Scripts chạy trực tiếp phải bootstrap sys.path trước khi import package
# `src.*`, nên import muộn ở đầu file là chủ đích chứ không phải sơ suất.
"src/scripts/**" = ["E402"]
# Directly executed evaluation entry points bootstrap the repository root before
# importing project modules. Those imports must remain below the sys.path setup.
"eval/g2_live_rag.py" = ["E402"]
"eval/rag/rebuild_canonical_index.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
# Historical/audit prose and retained evaluation reports are evidence, not
# formatter-owned source. Python files under these trees remain in scope.
exclude = [
    "docs/archive/**",
    "docs/audit/**",
    "eval/**/*.md",
]
