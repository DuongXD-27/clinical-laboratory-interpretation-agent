name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Runner của BTC dùng chung cho tất cả team, jobs xếp hàng FIFO. Push liên tiếp
# vào cùng 1 nhánh thì huỷ run cũ, khỏi chiếm chỗ của team khác.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Org hết hạn mức GitHub-hosted runner nên job không start được.
    # BTC có runner dùng chung, chỉ cần trỏ runs-on sang self-hosted.
    runs-on: self-hosted
    # Chặn job treo chiếm runner chung; bình thường chạy dưới 5 phút.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Reject tracked generated artifacts
        run: python scripts/check_tracked_generated_artifacts.py

      - name: Run tests
        run: pytest tests/ -v --tb=short --basetemp scratch/pytest-ci
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  frontend:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
